services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiyu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aiyu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aiyu-network
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-256m}
    cpus: ${POSTGRES_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiyu} -d ${POSTGRES_DB:-aiyu}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: aiyuayaan/aiyu:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # In-container host MUST be the "postgres" service, never "localhost".
      # Built from POSTGRES_* (not $DATABASE_URL, which host-dev .env sets to
      # localhost and Compose auto-loads). Set APP_DATABASE_URL for an external DB.
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://${POSTGRES_USER:-aiyu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiyu}?schema=public}
      # Apply pending Prisma migrations on container start (entrypoint).
      RUN_MIGRATIONS: "true"
      NEXT_PUBLIC_N8N_WEBHOOK_URL: ${NEXT_PUBLIC_N8N_WEBHOOK_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      SITE_URL: ${SITE_URL}
      NEXT_PUBLIC_AUTHOR_NAME: ${NEXT_PUBLIC_AUTHOR_NAME}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BLOG_API_KEY: ${BLOG_API_KEY}
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=256}
    volumes:
      - uploads_data:/app/public/uploads
      - nextjs_cache:/app/.next/cache
    tmpfs:
      - /tmp:noexec,nosuid,nodev,mode=1777
      - /var/tmp:noexec,nosuid,nodev,mode=1777
      - /run:noexec,nosuid,nodev,mode=755
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: ${APP_MEMORY_LIMIT:-384m}
    mem_reservation: ${APP_MEMORY_RESERVATION:-192m}
    cpus: ${APP_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "sh", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 150s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aiyu-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./public:/srv/public:ro
      - uploads_data:/srv/uploads:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - aiyu-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    driver: local
  nextjs_cache:
    driver: local
  uploads_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  aiyu-network:
    driver: bridge
