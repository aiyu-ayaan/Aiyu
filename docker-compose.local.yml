services:
  # The old database, kept only to copy it into SQLite (development/docs/SQLITE_CUTOVER.md). It does not start
  # unless asked for: docker compose --profile postgres up -d --wait postgres
  postgres:
    profiles: [ "postgres" ]
    image: postgres:17-alpine
    container_name: aiyu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiyu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-aiyu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aiyu-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiyu} -d ${POSTGRES_DB:-aiyu}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Only pass public variables as build args.
        - NEXT_PUBLIC_N8N_WEBHOOK_URL=${NEXT_PUBLIC_N8N_WEBHOOK_URL}
        - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
        - NEXT_PUBLIC_AUTHOR_NAME=${NEXT_PUBLIC_AUTHOR_NAME}
    container_name: aiyu-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Only for the one-time copy from Postgres (development/docs/SQLITE_CUTOVER.md): empty unless
      # POSTGRES_PASSWORD is still set. While it is, the server will not create a missing SQLite database.
      DATABASE_URL: ${APP_DATABASE_URL:-${POSTGRES_PASSWORD:+postgresql://${POSTGRES_USER:-aiyu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiyu}}}
      # "auto" fills an empty database only; "force" replaces the base content (destructive).
      RUN_SEED: ${RUN_SEED:-auto}
      # N8N webhook URL
      NEXT_PUBLIC_N8N_WEBHOOK_URL: ${NEXT_PUBLIC_N8N_WEBHOOK_URL}
      # Base URL for SEO/OG tags
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_AUTHOR_NAME: ${NEXT_PUBLIC_AUTHOR_NAME}
      CANONICAL_HOST_REDIRECT: "false"

      # GitHub OAuth
      GITHUB_AUTH_ENABLED: ${GITHUB_AUTH_ENABLED:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_ALLOWED_ID: ${GITHUB_ALLOWED_ID}

      # Admin credentials
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

      NODE_ENV: production
    volumes:
      # Persistent uploads directory (named volume for proper permissions)
      - uploads_data:/app/public/uploads
      # The SQLite database (with its -wal and -shm files). Back it up from the admin panel.
      - sqlite_data:/app/data
      # Scratch space for backups and restores (on disk; the root filesystem is read-only)
      - backup_cache:/app/.cache
    tmpfs:
      # CRITICAL SECURITY: Mount /tmp with noexec to prevent crypto miners from executing
      - /tmp:noexec,nosuid,nodev,mode=1777,size=100M
      # Additional tmpfs mounts with noexec and nosuid for security
      - /var/tmp:noexec,nosuid,nodev,mode=1777,size=50M
      # /run uses 755 (not 1777) - only owner (nextjs user) needs write access for PID files
      - /run:noexec,nosuid,nodev,mode=755,size=10M
    # CRITICAL SECURITY: Drop all capabilities and enable security restrictions
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # Only allow binding to network ports
    security_opt:
      - no-new-privileges:true # Prevent privilege escalation
    # Read-only root filesystem (except for writable volumes)
    read_only: true
    # No memory/CPU caps: the app may use the full host capacity. Docker
    # only OOM-kills a container when a limit is set.
    # Health check to detect abnormal behavior
    healthcheck:
      test: [ "CMD", "/app/aiyu-server", "healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aiyu-network

  nginx:
    image: nginx:alpine
    ports:
      # HTTP only — TLS is terminated upstream (Cloudflare tunnel/edge). No 443.
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/srv/public:ro
      - uploads_data:/srv/uploads:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - aiyu-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/nginx-health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  backup_cache:
    driver: local
  uploads_data:
    driver: local
  sqlite_data:
    driver: local
  nginx_cache:
    driver: local

# Network for inter-service communication
networks:
  aiyu-network:
    driver: bridge
