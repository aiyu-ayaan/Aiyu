services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:17-alpine
    container_name: aiyu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiyu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aiyu}
    # Port mapping commented out for security - app reaches it via the internal
    # network. Uncomment if you need host access (e.g. Prisma Studio / pgAdmin):
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aiyu-network
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-256m}
    cpus: ${POSTGRES_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiyu} -d ${POSTGRES_DB:-aiyu}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Next.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Only pass public variables as build args.
        # DATABASE_URL uses a dummy value at build time (see Dockerfile) to keep
        # credentials out of image layers; the real one is provided at runtime.
        - NEXT_PUBLIC_N8N_WEBHOOK_URL=${NEXT_PUBLIC_N8N_WEBHOOK_URL}
        - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
        - NEXT_PUBLIC_AUTHOR_NAME=${NEXT_PUBLIC_AUTHOR_NAME}
    container_name: aiyu-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # PostgreSQL connection. The in-container host MUST be the "postgres"
      # service, never "localhost". We intentionally do NOT read $DATABASE_URL
      # here: the .env used for host dev sets it to localhost, and Compose
      # auto-loads .env, so honoring it would point the container at itself.
      # The URL is built from the POSTGRES_* vars instead. To use an external
      # managed database, set APP_DATABASE_URL.
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://${POSTGRES_USER:-aiyu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiyu}?schema=public}
      # Run `prisma migrate deploy` from the container entrypoint before boot.
      RUN_MIGRATIONS: "true"
      # N8N webhook URL
      NEXT_PUBLIC_N8N_WEBHOOK_URL: ${NEXT_PUBLIC_N8N_WEBHOOK_URL}
      # Base URL for SEO/OG tags
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_AUTHOR_NAME: ${NEXT_PUBLIC_AUTHOR_NAME}
      CANONICAL_HOST_REDIRECT: "false"

      # GitHub OAuth
      GITHUB_AUTH_ENABLED: ${GITHUB_AUTH_ENABLED:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_ALLOWED_ID: ${GITHUB_ALLOWED_ID}

      # Admin credentials
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

      # Node environment
      NODE_ENV: production
    volumes:
      # Persistent uploads directory (named volume for proper permissions)
      - uploads_data:/app/public/uploads
      # Writable Next.js cache directory (volume for read-only filesystem)
      - nextjs_cache:/app/.next/cache
    tmpfs:
      # CRITICAL SECURITY: Mount /tmp with noexec to prevent crypto miners from executing
      - /tmp:noexec,nosuid,nodev,mode=1777,size=100M
      # Additional tmpfs mounts with noexec and nosuid for security
      - /var/tmp:noexec,nosuid,nodev,mode=1777,size=50M
      # /run uses 755 (not 1777) - only owner (nextjs user) needs write access for PID files
      - /run:noexec,nosuid,nodev,mode=755,size=10M
    # CRITICAL SECURITY: Drop all capabilities and enable security restrictions
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # Only allow binding to network ports
    security_opt:
      - no-new-privileges:true # Prevent privilege escalation
    # Read-only root filesystem (except for writable volumes)
    read_only: true
    # No memory/CPU caps: the app may use the full host capacity. Docker
    # only OOM-kills a container when a limit is set.
    # Health check to detect abnormal behavior
    # Uses curl (installed in Dockerfile) with fallback chain
    healthcheck:
      test: [ "CMD", "sh", "/app/healthcheck.sh" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - aiyu-network

  nginx:
    image: nginx:alpine
    ports:
      # HTTP only — TLS is terminated upstream (Cloudflare tunnel/edge). No 443.
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/srv/public:ro
      - uploads_data:/srv/uploads:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - aiyu-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/nginx-health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  nextjs_cache:
    driver: local
  uploads_data:
    driver: local
  nginx_cache:
    driver: local

# Network for inter-service communication
networks:
  aiyu-network:
    driver: bridge
