# Development database stack.
#
# Brings up ONLY PostgreSQL (+ pgAdmin) so you can run the Next.js app and the
# Prisma CLI directly on your host machine (npm run dev), pointing
# DATABASE_URL at localhost:${POSTGRES_PORT}.
#
#   docker compose -f docker-compose-dev.yml up -d      # or: npm run db:up
#   npx prisma migrate deploy                            # apply schema
#   npm run db:seed                                      # populate sample data
#   npm run dev
#
# Postgres is published to the host so Prisma/pgAdmin can reach it. pgAdmin is
# optional — open http://localhost:${PGADMIN_PORT:-5050}.

services:
  postgres:
    image: postgres:17-alpine
    container_name: aiyu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiyu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiyu}
      POSTGRES_DB: ${POSTGRES_DB:-aiyu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aiyu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiyu} -d ${POSTGRES_DB:-aiyu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aiyu-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@aiyu.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-aiyu}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aiyu-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  aiyu-network:
    driver: bridge
