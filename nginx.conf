worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging (reduce I/O)
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Proxy cache zone
    proxy_cache_path /var/cache/nginx levels=1:2
        keys_zone=NEXTJS:20m
        max_size=200m
        inactive=60m
        use_temp_path=off;

    # Upstream
    upstream nextjs {
        server app:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Client body
        client_max_body_size 10m;

        # Proxy buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Shared proxy settings
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # ── Static assets (immutable, 1 year) ──
        location /_next/static/ {
            proxy_pass http://nextjs;
            expires 1y;
            add_header Cache-Control "public, immutable";
            proxy_cache NEXTJS;
            proxy_cache_valid 200 365d;
        }

        # ── Uploads ──
        location /uploads/ {
            proxy_pass http://nextjs;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            proxy_cache NEXTJS;
            proxy_cache_valid 200 7d;
        }

        # ── Health check (no cache, no limits) ──
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        location = /api/health {
            proxy_pass http://nextjs;
        }

        # ── Admin (no cache, pass-through) ──
        location /admin {
            proxy_pass http://nextjs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── API write routes (no cache) ──
        location /api/auth {
            proxy_pass http://nextjs;
        }
        location /api/admin {
            proxy_pass http://nextjs;
        }
        location /api/contact {
            proxy_pass http://nextjs;
        }
        location /api/upload {
            proxy_pass http://nextjs;
            client_max_body_size 10m;
        }

        # ── API read routes (cached 30s) ──
        location /api/ {
            proxy_pass http://nextjs;

            proxy_cache NEXTJS;
            proxy_cache_key "$request_method|$host|$request_uri";
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_background_update on;
            proxy_cache_methods GET HEAD;

            # CRITICAL: override upstream no-store headers
            proxy_ignore_headers Cache-Control Set-Cookie Vary Expires X-Accel-Expires;

            # Skip cache for authenticated / non-GET
            set $no_cache 0;
            if ($http_authorization) {
                set $no_cache 1;
            }
            if ($request_method != GET) {
                set $no_cache 1;
            }
            proxy_cache_bypass $no_cache;
            proxy_no_cache $no_cache;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ── All pages (cached 60s) ──
        location / {
            proxy_pass http://nextjs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_cache NEXTJS;
            proxy_cache_key "$request_method|$host|$request_uri";
            proxy_cache_valid 200 60s;
            proxy_cache_valid 301 302 10s;
            proxy_cache_valid 404 5s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # CRITICAL: override upstream no-store headers
            proxy_ignore_headers Cache-Control Set-Cookie Vary Expires X-Accel-Expires;

            # Thundering herd: only 1 request hits Node, rest get stale
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_background_update on;

            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
