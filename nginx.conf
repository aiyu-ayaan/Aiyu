worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log /var/log/nginx/error.log warn;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Speed up frequent static file lookups.
    open_file_cache max=2000 inactive=120s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    proxy_cache_path /var/cache/nginx levels=1:2
        keys_zone=NEXTJS:50m
        max_size=500m
        inactive=120m
        use_temp_path=off;

    upstream nextjs {
        server app:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;
        root /srv/public;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 10m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        location = /api/health {
            proxy_pass http://nextjs;
        }

        # Keep existing upload URL logic (/api/uploads/*), but serve files directly from nginx.
        location ^~ /api/uploads/ {
            alias /srv/uploads/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }

        # Optional direct uploads path (for manual use / future compatibility).
        location ^~ /uploads/ {
            alias /srv/uploads/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }

        location ^~ /_next/static/ {
            proxy_pass http://nextjs;
            proxy_cache NEXTJS;
            proxy_cache_key "$scheme|$request_method|$host|$request_uri";
            proxy_cache_valid 200 365d;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Serve common static assets from /public directly whenever present.
        location ~* \.(?:ico|txt|xml|webmanifest|pdf|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot)$ {
            access_log off;
            try_files $uri @nextjs;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        }

        # Never cache admin pages.
        location ^~ /admin {
            proxy_pass http://nextjs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Write/auth endpoints should never be cached.
        location ^~ /api/auth {
            proxy_pass http://nextjs;
        }

        location ^~ /api/admin {
            proxy_pass http://nextjs;
        }

        location ^~ /api/contact {
            proxy_pass http://nextjs;
        }

        location ^~ /api/upload {
            proxy_pass http://nextjs;
            client_max_body_size 10m;
        }

        # Read APIs: short cache with safe bypass rules.
        location ^~ /api/ {
            proxy_pass http://nextjs;
            proxy_cache NEXTJS;
            proxy_cache_key "$scheme|$request_method|$host|$request_uri";
            proxy_cache_valid 200 30s;
            proxy_cache_valid 404 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_background_update on;
            proxy_cache_methods GET HEAD;
            proxy_ignore_headers Cache-Control Expires;

            set $skip_cache 0;
            if ($request_method != GET) {
                set $skip_cache 1;
            }
            if ($http_authorization != "") {
                set $skip_cache 1;
            }
            if ($http_cookie != "") {
                set $skip_cache 1;
            }
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            try_files $uri @nextjs;
        }

        # Page microcache to reduce TTFB on repeated traffic.
        location @nextjs {
            proxy_pass http://nextjs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_cache NEXTJS;
            proxy_cache_key "$scheme|$request_method|$host|$request_uri";
            proxy_cache_valid 200 60s;
            proxy_cache_valid 301 302 30s;
            proxy_cache_valid 404 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_background_update on;
            proxy_ignore_headers Cache-Control Expires;

            set $skip_cache 0;
            if ($request_method != GET) {
                set $skip_cache 1;
            }
            if ($http_authorization != "") {
                set $skip_cache 1;
            }
            if ($http_cookie != "") {
                set $skip_cache 1;
            }
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;

            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
