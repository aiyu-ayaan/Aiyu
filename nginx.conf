worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging (reduce I/O in production)
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Brotli (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # Proxy cache - increased size for better hit rates
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=NEXTJS:20m max_size=200m inactive=60m use_temp_path=off;

    # CRITICAL: Ignore upstream cache-control headers
    # Next.js force-dynamic sends "no-store" which would bypass cache entirely
    proxy_ignore_headers Cache-Control Set-Cookie Vary;
    proxy_hide_header Set-Cookie;

    # Proxy buffering (buffer responses before sending to client)
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Upstream (Next.js app)
    upstream nextjs {
        server app:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Client body size (for file uploads)
        client_max_body_size 10m;

        # Static files from Next.js (immutable, long cache)
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Cache static assets aggressively
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # Proxy cache
            proxy_cache NEXTJS;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating;
        }

        # Uploaded images
        location /uploads/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            
            proxy_cache NEXTJS;
            proxy_cache_valid 200 7d;
        }

        # API routes (rate limited, short cache)
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache GET API responses briefly
            proxy_cache NEXTJS;
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale error timeout updating http_502 http_503;
            proxy_cache_lock on;
            proxy_cache_background_update on;
            proxy_cache_bypass $http_authorization;
            
            # Don't cache POST/PUT/DELETE
            proxy_cache_methods GET HEAD;
        }

        # All other routes (Next.js pages)
        location / {
            limit_req zone=general burst=100 nodelay;
            
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache pages for 60s — serves ALL concurrent users from cache
            proxy_cache NEXTJS;
            proxy_cache_valid 200 60s;
            proxy_cache_valid 301 302 10s;
            proxy_cache_valid 404 1s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_lock_age 5s;
            
            # Only let 1 request through to Node when cache expires (thundering herd protection)
            proxy_cache_background_update on;
            
            # Add cache status header for debugging
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Health check endpoint (bypass rate limiting)
        location /api/health {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
