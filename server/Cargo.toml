[package]
name = "aiyu-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes = "0.8"
anyhow = "1"
async_zip = { version = "0.0.17", features = ["tokio", "deflate"] }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cbc = { version = "0.1", features = ["alloc", "std"] }
dotenvy = "0.15"
futures-util = { version = "0.3", features = ["io"] }
hex = "0.4"
ipnet = "2"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
