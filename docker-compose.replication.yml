# High-availability PostgreSQL via streaming replication (Bitnami images).
#
# Topology: 1 primary + 2 read replicas. The app talks to the primary for
# reads AND writes (single DATABASE_URL pointing at "postgres-primary").
# The replicas provide hot standbys / read scaling and can be promoted on
# failover.
#
# Required env (see .env.example):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   POSTGRES_REPLICATION_USER, POSTGRES_REPLICATION_PASSWORD
#
#   docker compose --env-file .env.production -f docker-compose.replication.yml up -d

services:
  postgres-primary:
    image: bitnami/postgresql:17
    restart: unless-stopped
    hostname: postgres-primary
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-aiyu}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-aiyu}
    volumes:
      - postgres_primary_data:/bitnami/postgresql
    networks:
      - aiyu-network
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-256m}
    cpus: ${POSTGRES_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiyu} -d ${POSTGRES_DB:-aiyu}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres-replica-1:
    image: bitnami/postgresql:17
    restart: unless-stopped
    hostname: postgres-replica-1
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_MASTER_PORT_NUMBER: "5432"
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_replica1_data:/bitnami/postgresql
    networks:
      - aiyu-network
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-256m}
    cpus: ${POSTGRES_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiyu} -d ${POSTGRES_DB:-aiyu}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-replica-2:
    image: bitnami/postgresql:17
    restart: unless-stopped
    hostname: postgres-replica-2
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_MASTER_PORT_NUMBER: "5432"
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_replica2_data:/bitnami/postgresql
    networks:
      - aiyu-network
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-256m}
    cpus: ${POSTGRES_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiyu} -d ${POSTGRES_DB:-aiyu}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: aiyuayaan/aiyu:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-aiyu}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB:-aiyu}?schema=public}
      RUN_MIGRATIONS: "true"
      NEXT_PUBLIC_N8N_WEBHOOK_URL: ${NEXT_PUBLIC_N8N_WEBHOOK_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      SITE_URL: ${SITE_URL}
      NEXT_PUBLIC_AUTHOR_NAME: ${NEXT_PUBLIC_AUTHOR_NAME}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=256}
    volumes:
      - uploads_data:/app/public/uploads
      - nextjs_cache:/app/.next/cache
    tmpfs:
      - /tmp:noexec,nosuid,nodev,mode=1777
      - /var/tmp:noexec,nosuid,nodev,mode=1777
      - /run:noexec,nosuid,nodev,mode=755
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: ${APP_MEMORY_LIMIT:-384m}
    mem_reservation: ${APP_MEMORY_RESERVATION:-192m}
    cpus: ${APP_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "sh", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 150s
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - aiyu-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./public:/srv/public:ro
      - uploads_data:/srv/uploads:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - aiyu-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_primary_data:
    driver: local
  postgres_replica1_data:
    driver: local
  postgres_replica2_data:
    driver: local
  nextjs_cache:
    driver: local
  uploads_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  aiyu-network:
    driver: bridge
