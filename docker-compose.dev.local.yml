# Optional PostgreSQL (+ pgAdmin) stack for migration / import testing.
#
# SQLite (data/aiyu.db) is the primary database and is created automatically by
# aiyu-server — you do NOT need this file for normal development (`pnpm dev`).
# Keep this only as an optional import source for `aiyu-server import-postgres`
# or Postgres-to-SQLite migration testing (see development/docs/SQLITE_CUTOVER.md):
#
#   docker compose -f docker-compose.dev.local.yml up -d      # or: pnpm db:up
#   DATABASE_URL=postgresql://aiyu:aiyu@localhost:5432/aiyu \
#     server/target/release/aiyu-server import-postgres
#
# Postgres is published to the host on localhost:${POSTGRES_PORT:-5432}.
# pgAdmin is optional — open http://localhost:${PGADMIN_PORT:-5050}.

services:
  postgres:
    image: postgres:17-alpine
    container_name: aiyu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiyu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiyu}
      POSTGRES_DB: ${POSTGRES_DB:-aiyu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aiyu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiyu} -d ${POSTGRES_DB:-aiyu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aiyu-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@aiyu.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-aiyu}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aiyu-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  aiyu-network:
    driver: bridge
