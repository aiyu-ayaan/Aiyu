name: Setup Node & install dependencies
description: >-
  Shared setup for CI jobs — pins Node, restores the pnpm cache and installs
  dependencies reproducibly. Assumes the repo is already checked out.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: 20.x

runs:
  using: composite
  steps:
    # pnpm version comes from package.json "packageManager".
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      # Installs straight from the lockfile; peer and build-script rules live in
      # pnpm-workspace.yaml. The repo's `postinstall` runs `prisma generate`, so
      # the Prisma client is ready for build and e2e jobs after this step.
      run: pnpm install --frozen-lockfile
