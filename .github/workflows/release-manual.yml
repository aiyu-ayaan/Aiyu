name: Build & Deploy Release (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to deploy (e.g., 1.2.3 or v1.2.3)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

jobs:
  determine-release:
    runs-on: ubuntu-latest
    outputs:
      release_as: ${{ steps.normalize.outputs.release_as }}
      version: ${{ steps.normalize.outputs.version }}

    steps:
      - name: Validate and normalize version input
        id: normalize
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re

          raw_version = os.environ.get("INPUT_VERSION", "").strip()
          if not raw_version:
              raise SystemExit("Version input is required.")

          normalized = raw_version[1:] if raw_version.lower().startswith("v") else raw_version
          if not re.fullmatch(r"\d+\.\d+\.\d+", normalized):
              raise SystemExit(
                  f"Invalid version '{raw_version}'. Use X.Y.Z or vX.Y.Z format."
              )

          output_file = os.environ["GITHUB_OUTPUT"]
          with open(output_file, "a", encoding="utf-8") as f:
              f.write(f"release_as={normalized}\n")
              f.write(f"version=v{normalized}\n")
          PY

  push-to-docker-hub:
    name: Push Docker image to Docker Hub
    needs: determine-release
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          VERSION="${{ needs.determine-release.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Docker image will be tagged with: $VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: aiyuayaan/aiyu
          tags: |
            type=raw,value=${{ steps.get-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/aiyuayaan/aiyu
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to Server
    needs: [determine-release, push-to-docker-hub]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          VERSION="${{ needs.determine-release.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            echo "Starting deployment..."

            echo "Navigating to project directory..."
            cd docker/Aiyu/ || { echo "Failed to navigate to docker/Aiyu/"; exit 1; }

            echo "Pulling latest Docker image..."
            docker compose pull || { echo "Failed to pull latest image"; exit 1; }

            echo "Restarting containers..."
            sudo docker compose up -d --force-recreate --scale app=3 || { echo "Failed to start containers"; exit 1; }

            echo "Deployment completed successfully!"

  create-release:
    name: Create GitHub Release
    needs: [determine-release, push-to-docker-hub]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          VERSION="${{ needs.determine-release.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating release: $VERSION"

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          release_name: Release ${{ steps.get-version.outputs.version }}
          body: |
            ## Release ${{ steps.get-version.outputs.version }}

            **Version:** ${{ steps.get-version.outputs.version }}

            **Docker Image:** aiyuayaan/aiyu:${{ steps.get-version.outputs.version }}

            This release was manually triggered by GitHub Actions.

            ### Deployment Status
            - Docker image pushed
            - Server deployed
          draft: false
          prerelease: false
