name: Release PR + Deploy After Merge

# Automated release flow driven by a marker at the START of a commit subject on
# master:
#   !major  -> major bump (1.x.x -> 2.0.0)
#   !feat   -> minor bump (x.1.x -> x.2.0)
#   !fix    -> patch bump (x.x.1 -> x.x.2)
# A push to master whose commit subject begins with one of these markers opens
# (or updates) a release PR with categorized release notes. Merging that release
# PR builds + pushes the Docker image, deploys, and publishes a GitHub Release.
# Pushes without a leading marker are skipped. Markers are matched only on the
# subject line (not the body), so a commit that merely mentions a marker in its
# description does not trigger a release.
#
# HOTFIX marker (emergency path, NO version bump, NO PR):
#   !hotfix -> rebuild + overwrite the CURRENT package.json version
# Use this when an already-released Docker image is broken and needs an
# immediate fix. A push to master whose subject begins with !hotfix builds the
# image clean (--no-cache) for the current version, force-overwrites the
# aiyuayaan/aiyu:<current> and :latest tags on Docker Hub, redeploys the server
# (recreating containers + pruning the stale image), and APPENDS a hotfix note
# to that version's existing GitHub Release. It does NOT open a PR, does NOT
# bump the version, and does NOT match the !fix marker above, so the normal
# release/deploy jobs stay dormant for a hotfix push.

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

# Serialize release runs on master so two quick pushes never build/deploy on top
# of each other. cancel-in-progress is intentionally false: an in-flight Docker
# push or SSH deploy must finish rather than be killed mid-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-release:
    name: Determine Next Version
    # Runs on every push to master. Proceeds only when a pushed commit's SUBJECT
    # starts with a release marker (!major / !feat / !fix); otherwise
    # should_release=false and every release-PR step is skipped.
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.bump.outputs.should_release }}
      release_type: ${{ steps.bump.outputs.release_type }}
      release_as: ${{ steps.bump.outputs.release_as }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release type and next version
        id: bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          allowed_types = {"feat", "fix", "major"}

          # A marker is honored ONLY at the start of a commit subject line (after
          # optional leading whitespace). Matching the subject — not the body —
          # prevents commits that merely document the markers from triggering a
          # release. Highest precedence wins: major > feat > fix.
          MARKERS = [
              ("major", re.compile(r"^\s*!major(?!\w)", re.IGNORECASE)),
              ("feat", re.compile(r"^\s*!feat(?!\w)", re.IGNORECASE)),
              ("fix", re.compile(r"^\s*!fix(?!\w)", re.IGNORECASE)),
          ]
          # A merged release PR lands as "chore(master): release vX.Y.Z" — never
          # treat that commit as a trigger, so releases don't loop.
          RELEASE_COMMIT = re.compile(
              r"^\s*chore(?:\([^)]+\))?:\s*release\s+v?\d+\.\d+\.\d+\s*$",
              re.IGNORECASE,
          )

          def detect(subjects):
              for release_type, pattern in MARKERS:
                  if any(pattern.match(subject) for subject in subjects):
                      return release_type
              return ""

          before = os.environ.get("BEFORE_SHA", "").strip()
          after = os.environ.get("AFTER_SHA", "").strip()
          subjects = []
          try:
              if before and set(before) != {"0"}:
                  out = subprocess.check_output(
                      ["git", "log", f"{before}..{after}", "--format=%s"],
                      text=True,
                  )
                  subjects = [s for s in out.splitlines() if s.strip()]
              if not subjects:
                  out = subprocess.check_output(
                      ["git", "log", "-1", "--format=%s"], text=True
                  )
                  subjects = [out.strip()]
          except subprocess.CalledProcessError:
              subjects = [os.environ.get("HEAD_COMMIT_MESSAGE", "").splitlines()[0]
                          if os.environ.get("HEAD_COMMIT_MESSAGE") else ""]

          non_release = [s for s in subjects if not RELEASE_COMMIT.match(s.strip())]
          release_type = detect(non_release)
          should_release = release_type in allowed_types

          output_file = os.environ["GITHUB_OUTPUT"]
          if not should_release:
              with open(output_file, "a", encoding="utf-8") as f:
                  f.write("should_release=false\n")
              print("No release marker (!major/!feat/!fix) found; skipping release.")
              raise SystemExit(0)

          current_version = json.loads(
              open("package.json", encoding="utf-8").read()
          ).get("version", "").strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", current_version):
              raise SystemExit(f"Invalid package.json version '{current_version}'. Expected X.Y.Z.")

          major, minor, patch = [int(part) for part in current_version.split(".")]
          if release_type == "feat":
              minor += 1
              patch = 0
          elif release_type == "fix":
              patch += 1
          else:
              major += 1
              minor = 0
              patch = 0

          release_as = f"{major}.{minor}.{patch}"
          version = f"v{release_as}"

          with open(output_file, "a", encoding="utf-8") as f:
              f.write("should_release=true\n")
              f.write(f"release_type={release_type}\n")
              f.write(f"release_as={release_as}\n")
              f.write(f"version={version}\n")

          print(f"Current version: {current_version}")
          print(f"Release type: {release_type}")
          print(f"Next version: {version}")
          PY

  create-release-pr:
    name: Create or Update Release PR
    if: needs.determine-release.outputs.should_release == 'true'
    needs: determine-release
    runs-on: ubuntu-latest
    outputs:
      pull_request_number: ${{ steps.cpr.outputs.pull-request-number }}
      pull_request_url: ${{ steps.cpr.outputs.pull-request-url }}
      pull_request_operation: ${{ steps.cpr.outputs.pull-request-operation }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release version files
        env:
          NEXT_VERSION: ${{ needs.determine-release.outputs.release_as }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import date
          from pathlib import Path

          next_version = os.environ["NEXT_VERSION"].strip()
          repository = os.environ.get("GITHUB_REPOSITORY", "aiyu-ayaan/Aiyu").strip()

          package_path = Path("package.json")
          package_lock_path = Path("package-lock.json")
          manifest_path = Path(".release-please-manifest.json")
          changelog_path = Path("CHANGELOG.md")

          def write_json(path: Path, data: dict) -> None:
              path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          package_data = json.loads(package_path.read_text(encoding="utf-8"))
          current_version = package_data.get("version", "").strip()
          if not current_version:
              raise SystemExit("package.json version is missing.")

          package_data["version"] = next_version
          write_json(package_path, package_data)

          lock_data = json.loads(package_lock_path.read_text(encoding="utf-8"))
          lock_data["version"] = next_version
          if isinstance(lock_data.get("packages"), dict) and isinstance(lock_data["packages"].get(""), dict):
              lock_data["packages"][""]["version"] = next_version
          write_json(package_lock_path, lock_data)

          manifest_data = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest_data["."] = next_version
          write_json(manifest_path, manifest_data)

          changelog_text = changelog_path.read_text(encoding="utf-8")
          compare_url = f"https://github.com/{repository}/compare/v{current_version}...v{next_version}"
          heading = f"## [{next_version}]({compare_url}) ({date.today().isoformat()})"

          def clean(msg: str) -> str:
              # Drop the release marker and any conventional-commit prefix, then
              # tidy the message so the changelog reads as proper release notes.
              text = re.sub(r"\s*!(major|feat|fix)\b", "", msg, flags=re.IGNORECASE)
              text = re.sub(
                  r"^(feat|fix|chore|docs|refactor|perf|test|build|ci|style)(\([^)]*\))?!?:\s*",
                  "",
                  text.strip(),
                  flags=re.IGNORECASE,
              )
              text = text.strip().rstrip(".")
              return (text[:1].upper() + text[1:]) if text else text

          if heading not in changelog_text:
              commits_output = subprocess.check_output(
                  ["git", "log", f"v{current_version}..HEAD", "--format=%s"],
                  text=True,
              ).strip()

              features, bug_fixes, breaking_changes, other_commits = [], [], [], []
              for commit_msg in [c for c in commits_output.split("\n") if c.strip()]:
                  lowered = commit_msg.lower()
                  if "!major" in lowered or "BREAKING" in commit_msg.upper():
                      breaking_changes.append(clean(commit_msg))
                  elif "!feat" in lowered or lowered.startswith("feat"):
                      features.append(clean(commit_msg))
                  elif "!fix" in lowered or lowered.startswith("fix"):
                      bug_fixes.append(clean(commit_msg))
                  else:
                      other_commits.append(clean(commit_msg))

              entry = f"{heading}\n\n"
              for title, items in (
                  ("### ⚠ BREAKING CHANGES", breaking_changes),
                  ("### Features", features),
                  ("### Bug Fixes", bug_fixes),
                  ("### Other Changes", other_commits),
              ):
                  if items:
                      entry += f"{title}\n\n"
                      for item in items:
                          entry += f"* {item}\n"
                      entry += "\n"

              if not (breaking_changes or features or bug_fixes or other_commits):
                  entry += f"### Notes\n\n* Release {next_version}\n\n"

              marker = "# Changelog\n\n"
              if marker in changelog_text:
                  changelog_text = changelog_text.replace(marker, marker + entry, 1)
              else:
                  changelog_text = "# Changelog\n\n" + entry + changelog_text
              changelog_path.write_text(changelog_text, encoding="utf-8")

          print(f"Current version: {current_version}")
          print(f"Next version: {next_version}")
          PY

      - name: Create or update release PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(master): release v${{ needs.determine-release.outputs.release_as }}'
          title: 'chore(master): release v${{ needs.determine-release.outputs.release_as }}'
          body: |
            Automated release PR (${{ needs.determine-release.outputs.release_type }} bump) triggered by a commit marker on master.

            - Release type: ${{ needs.determine-release.outputs.release_type }}
            - Target version: v${{ needs.determine-release.outputs.release_as }}
            - Updated files:
              - package.json
              - package-lock.json
              - .release-please-manifest.json
              - CHANGELOG.md

            Categorized release notes for this version are in `CHANGELOG.md` (see the diff below).
            Deployment + GitHub Release run automatically after this PR is merged into master.
          branch: chore/release-v${{ needs.determine-release.outputs.release_as }}
          base: master
          labels: release
          delete-branch: true

      - name: Ensure release PR was created or updated
        if: steps.cpr.outputs.pull-request-number == ''
        run: |
          echo "No release PR was created or updated."
          echo "Check if target version already exists or branch protection blocks PR creation."
          exit 1

      - name: Release PR summary
        run: |
          echo "Requested release type: ${{ needs.determine-release.outputs.release_type }}"
          echo "Target version: ${{ needs.determine-release.outputs.version }}"
          echo "pull_request_number=${{ steps.cpr.outputs.pull-request-number }}"
          echo "pull_request_url=${{ steps.cpr.outputs.pull-request-url }}"
          echo "pull_request_operation=${{ steps.cpr.outputs.pull-request-operation }}"
          echo "Release PR includes version updates in package.json, package-lock.json, CHANGELOG.md, and .release-please-manifest.json."

  detect-release-merge:
    name: Detect Merged Release Commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.detect.outputs.should_deploy }}
      version: ${{ steps.detect.outputs.version }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect if push is from merged release PR
        id: detect
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          commit_message = os.environ.get("HEAD_COMMIT_MESSAGE", "").strip()
          release_merge_match = re.match(
              r"^\s*chore(?:\([^)]+\))?:\s*release\s+v?(\d+\.\d+\.\d+)\s*$",
              commit_message,
              flags=re.IGNORECASE,
          )

          changed_files_output = subprocess.check_output(
              ["git", "show", "--name-only", "--pretty=", "HEAD"],
              text=True,
          )
          changed_files = {
              line.strip()
              for line in changed_files_output.splitlines()
              if line.strip()
          }

          release_files_match = (
              ".release-please-manifest.json" in changed_files
              and "package.json" in changed_files
              and "package-lock.json" in changed_files
          )

          should_deploy = "true" if (release_merge_match or release_files_match) else "false"

          if release_merge_match:
              version = f"v{release_merge_match.group(1)}"
          elif should_deploy == "true":
              with open("package.json", "r", encoding="utf-8") as f:
                  package_version = json.load(f).get("version", "").strip()
              version = f"v{package_version}" if package_version else ""
          else:
              version = ""

          output_file = os.environ["GITHUB_OUTPUT"]
          with open(output_file, "a", encoding="utf-8") as f:
              f.write(f"should_deploy={should_deploy}\n")
              f.write(f"version={version}\n")

          print(f"Commit message: {commit_message}")
          print(f"Release files match: {release_files_match}")
          print(f"should_deploy={should_deploy}")
          if version:
              print(f"version={version}")
          PY

      - name: Skip reason
        if: steps.detect.outputs.should_deploy != 'true'
        run: echo "Push is not from a merged release PR; deployment skipped."

  push-to-docker-hub:
    name: Push Docker image to Docker Hub
    needs: detect-release-merge
    if: github.event_name == 'push' && needs.detect-release-merge.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          VERSION="${{ needs.detect-release-merge.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Docker image will be tagged with: $VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: aiyuayaan/aiyu
          tags: |
            type=raw,value=${{ steps.get-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/aiyuayaan/aiyu
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to Server
    needs: [detect-release-merge, push-to-docker-hub]
    if: github.event_name == 'push' && needs.detect-release-merge.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          VERSION="${{ needs.detect-release-merge.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      # Ship the repo's deployment config to the server so docker-compose.yml and
      # nginx.conf on the host always match the released commit. Files land in a
      # staging dir; the SSH step below backs up, installs, and validates them.
      # Disable by setting repository variable SYNC_DEPLOY_CONFIG to "false".
      - name: Upload deployment config to server
        if: vars.SYNC_DEPLOY_CONFIG != 'false'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: 'docker-compose.yml,nginx.conf'
          target: docker/Aiyu/.deploy-sync/
          overwrite: true

      - name: Install deployment config on server
        if: vars.SYNC_DEPLOY_CONFIG != 'false'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            cd docker/Aiyu/ || { echo "Failed to navigate to docker/Aiyu/"; exit 1; }

            STAMP="$(date +%Y%m%d-%H%M%S)"
            mkdir -p .deploy-backup

            for FILE in docker-compose.yml nginx.conf; do
              NEW=".deploy-sync/$FILE"
              [ -f "$NEW" ] || { echo "Missing uploaded $FILE"; exit 1; }

              if [ -f "$FILE" ] && cmp -s "$FILE" "$NEW"; then
                echo "$FILE unchanged."
                continue
              fi

              if [ -f "$FILE" ]; then
                cp "$FILE" ".deploy-backup/$FILE.$STAMP"
                echo "Backed up $FILE to .deploy-backup/$FILE.$STAMP"
              fi
              cp "$NEW" "$FILE"
              echo "Updated $FILE from repo."
            done

            # Validate the new nginx.conf before any container restarts. A bad
            # config here would otherwise take the site down on `up -d`.
            echo "Validating nginx.conf..."
            if ! sudo docker run --rm \
              -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
              nginx:alpine nginx -t -c /etc/nginx/nginx.conf; then
              echo "nginx.conf failed validation; restoring previous config."
              if [ -f ".deploy-backup/nginx.conf.$STAMP" ]; then
                cp ".deploy-backup/nginx.conf.$STAMP" nginx.conf
              fi
              if [ -f ".deploy-backup/docker-compose.yml.$STAMP" ]; then
                cp ".deploy-backup/docker-compose.yml.$STAMP" docker-compose.yml
              fi
              exit 1
            fi

            echo "Validating docker-compose.yml..."
            sudo docker compose config -q || {
              echo "docker-compose.yml is invalid; restoring previous config."
              if [ -f ".deploy-backup/docker-compose.yml.$STAMP" ]; then
                cp ".deploy-backup/docker-compose.yml.$STAMP" docker-compose.yml
              fi
              if [ -f ".deploy-backup/nginx.conf.$STAMP" ]; then
                cp ".deploy-backup/nginx.conf.$STAMP" nginx.conf
              fi
              exit 1
            }

            rm -rf .deploy-sync
            # Keep only the 10 most recent backups per file.
            ls -1t .deploy-backup/docker-compose.yml.* 2>/dev/null | tail -n +11 | xargs -r rm -f
            ls -1t .deploy-backup/nginx.conf.* 2>/dev/null | tail -n +11 | xargs -r rm -f

            echo "Deployment config sync complete."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            echo "Starting deployment..."

            echo "Navigating to project directory..."
            cd docker/Aiyu/ || { echo "Failed to navigate to docker/Aiyu/"; exit 1; }

            echo "Pulling latest Docker image..."
            sudo docker compose pull || { echo "Failed to pull latest image"; exit 1; }

            echo "Restarting containers..."
            sudo docker compose up -d || { echo "Failed to start containers"; exit 1; }

            # nginx.conf is a bind mount, so a changed file does not make Compose
            # recreate the container. Reload explicitly to pick up config edits.
            echo "Reloading nginx config..."
            sudo docker compose exec -T nginx nginx -s reload || echo "nginx reload skipped."

            echo "Deployment completed successfully!"

  create-release:
    name: Create GitHub Release
    needs: [detect-release-merge, push-to-docker-hub]
    if: github.event_name == 'push' && needs.detect-release-merge.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        run: |
          VERSION="${{ needs.detect-release-merge.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating release: $VERSION"

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          RELEASE_VERSION: ${{ needs.detect-release-merge.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re

          version = os.environ["RELEASE_VERSION"].lstrip("v").strip()
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              text = ""

          notes = ""
          # Grab this version's section (## [x.y.z] ...) up to the next "## " heading.
          match = re.search(
              rf"(?ms)^##\s*\[?{re.escape(version)}\]?.*?(?=^##\s|\Z)",
              text,
          )
          if match:
              parts = match.group(0).strip().split("\n", 1)
              notes = parts[1].strip() if len(parts) > 1 else ""

          delimiter = "CHANGELOG_NOTES_EOF"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"notes<<{delimiter}\n{notes}\n{delimiter}\n")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          name: Release ${{ steps.get-version.outputs.version }}
          generate_release_notes: true
          body: |
            **Docker Image:** `aiyuayaan/aiyu:${{ steps.get-version.outputs.version }}`

            ### Deployment Status
            - ✅ Docker image pushed to Docker Hub
            - ✅ Server successfully deployed

            ${{ steps.notes.outputs.notes }}

            ---
          draft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # HOTFIX PATH — emergency rebuild of the current version's Docker image.
  # Triggered by a commit whose SUBJECT starts with !hotfix. No version bump,
  # no release PR. Runs independently of the release jobs above.
  # ---------------------------------------------------------------------------
  detect-hotfix:
    name: Detect Hotfix Marker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_hotfix: ${{ steps.detect.outputs.should_hotfix }}
      version: ${{ steps.detect.outputs.version }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect !hotfix marker on pushed commit subject(s)
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          # !hotfix is honored ONLY at the start of a subject line. (?!\w) keeps
          # it from matching things like "!hotfixes". It deliberately does not
          # overlap with the !fix release marker.
          HOTFIX = re.compile(r"^\s*!hotfix(?!\w)", re.IGNORECASE)
          # A merged release PR lands as "chore(master): release vX.Y.Z" — never
          # treat that as a hotfix trigger.
          RELEASE_COMMIT = re.compile(
              r"^\s*chore(?:\([^)]+\))?:\s*release\s+v?\d+\.\d+\.\d+\s*$",
              re.IGNORECASE,
          )

          before = os.environ.get("BEFORE_SHA", "").strip()
          after = os.environ.get("AFTER_SHA", "").strip()
          subjects = []
          try:
              if before and set(before) != {"0"}:
                  out = subprocess.check_output(
                      ["git", "log", f"{before}..{after}", "--format=%s"],
                      text=True,
                  )
                  subjects = [s for s in out.splitlines() if s.strip()]
              if not subjects:
                  out = subprocess.check_output(
                      ["git", "log", "-1", "--format=%s"], text=True
                  )
                  subjects = [out.strip()]
          except subprocess.CalledProcessError:
              head = os.environ.get("HEAD_COMMIT_MESSAGE", "")
              subjects = [head.splitlines()[0] if head else ""]

          subjects = [s for s in subjects if not RELEASE_COMMIT.match(s.strip())]
          should_hotfix = any(HOTFIX.match(s) for s in subjects)

          version = ""
          if should_hotfix:
              current = json.loads(
                  open("package.json", encoding="utf-8").read()
              ).get("version", "").strip()
              if not re.fullmatch(r"\d+\.\d+\.\d+", current):
                  raise SystemExit(
                      f"Invalid package.json version '{current}'. Expected X.Y.Z."
                  )
              version = f"v{current}"

          output_file = os.environ["GITHUB_OUTPUT"]
          with open(output_file, "a", encoding="utf-8") as f:
              f.write(f"should_hotfix={'true' if should_hotfix else 'false'}\n")
              f.write(f"version={version}\n")

          if should_hotfix:
              print(f"Hotfix requested for current version {version}.")
          else:
              print("No !hotfix marker found; hotfix path skipped.")
          PY

      - name: Skip reason
        if: steps.detect.outputs.should_hotfix != 'true'
        run: echo "Push has no !hotfix marker; hotfix rebuild skipped."

  hotfix-build-push:
    name: Hotfix — Rebuild & overwrite Docker image
    needs: detect-hotfix
    if: github.event_name == 'push' && needs.detect-hotfix.outputs.should_hotfix == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          VERSION="${{ needs.detect-hotfix.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Rebuilding (clean) and overwriting image tag: $VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: aiyuayaan/aiyu
          tags: |
            type=raw,value=${{ steps.get-version.outputs.version }}
            type=raw,value=latest

      # no-cache: the previous image was broken, so build fresh rather than
      # risk reusing a poisoned layer. Pushing the same tag overwrites it on
      # Docker Hub; the old digest becomes untagged and is garbage-collected.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/aiyuayaan/aiyu
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  hotfix-deploy:
    name: Hotfix — Redeploy to Server
    needs: [detect-hotfix, hotfix-build-push]
    if: github.event_name == 'push' && needs.detect-hotfix.outputs.should_hotfix == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same config sync as the normal deploy: a hotfix may be a compose/nginx
      # fix, so the host files must match the pushed commit.
      - name: Upload deployment config to server
        if: vars.SYNC_DEPLOY_CONFIG != 'false'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: 'docker-compose.yml,nginx.conf'
          target: docker/Aiyu/.deploy-sync/
          overwrite: true

      - name: Install deployment config on server
        if: vars.SYNC_DEPLOY_CONFIG != 'false'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            cd docker/Aiyu/ || { echo "Failed to navigate to docker/Aiyu/"; exit 1; }

            STAMP="$(date +%Y%m%d-%H%M%S)"
            mkdir -p .deploy-backup

            for FILE in docker-compose.yml nginx.conf; do
              NEW=".deploy-sync/$FILE"
              [ -f "$NEW" ] || { echo "Missing uploaded $FILE"; exit 1; }

              if [ -f "$FILE" ] && cmp -s "$FILE" "$NEW"; then
                echo "$FILE unchanged."
                continue
              fi

              if [ -f "$FILE" ]; then
                cp "$FILE" ".deploy-backup/$FILE.$STAMP"
                echo "Backed up $FILE to .deploy-backup/$FILE.$STAMP"
              fi
              cp "$NEW" "$FILE"
              echo "Updated $FILE from repo."
            done

            restore() {
              [ -f ".deploy-backup/nginx.conf.$STAMP" ] && cp ".deploy-backup/nginx.conf.$STAMP" nginx.conf
              [ -f ".deploy-backup/docker-compose.yml.$STAMP" ] && cp ".deploy-backup/docker-compose.yml.$STAMP" docker-compose.yml
              true
            }

            echo "Validating nginx.conf..."
            sudo docker run --rm \
              -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
              nginx:alpine nginx -t -c /etc/nginx/nginx.conf || {
                echo "nginx.conf failed validation; restoring previous config."
                restore
                exit 1
              }

            echo "Validating docker-compose.yml..."
            sudo docker compose config -q || {
              echo "docker-compose.yml is invalid; restoring previous config."
              restore
              exit 1
            }

            rm -rf .deploy-sync
            ls -1t .deploy-backup/docker-compose.yml.* 2>/dev/null | tail -n +11 | xargs -r rm -f
            ls -1t .deploy-backup/nginx.conf.* 2>/dev/null | tail -n +11 | xargs -r rm -f

            echo "Deployment config sync complete."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            echo "Starting hotfix deployment..."

            cd docker/Aiyu/ || { echo "Failed to navigate to docker/Aiyu/"; exit 1; }

            echo "Pulling rebuilt image (same tag, new digest)..."
            sudo docker compose pull || { echo "Failed to pull image"; exit 1; }

            # --force-recreate ensures containers restart even though the tag
            # string is unchanged (only its digest moved).
            echo "Recreating containers..."
            sudo docker compose up -d --force-recreate || { echo "Failed to start containers"; exit 1; }

            echo "Pruning the stale (now-dangling) image..."
            sudo docker image prune -f || true

            echo "Hotfix deployment completed successfully!"

  hotfix-release-notes:
    name: Hotfix — Append note to release
    needs: [detect-hotfix, hotfix-build-push]
    if: github.event_name == 'push' && needs.detect-hotfix.outputs.should_hotfix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append hotfix note to GitHub Release and CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-hotfix.outputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["VERSION"].strip()          # e.g. v4.7.6
          bare = version.lstrip("v")
          raw = os.environ.get("COMMIT_MESSAGE", "").strip()
          subject = raw.splitlines()[0] if raw else ""
          subject = re.sub(r"^\s*!hotfix\b[:\-\s]*", "", subject, flags=re.IGNORECASE).strip()
          subject = subject or "Docker image rebuilt"
          sha = os.environ.get("COMMIT_SHA", "")[:7]
          run_url = os.environ.get("RUN_URL", "")
          stamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          note = (
              f"\n\n### 🔧 Hotfix ({stamp})\n\n"
              f"* {subject} ({sha})\n"
              f"* Image `aiyuayaan/aiyu:{version}` rebuilt clean (--no-cache) and redeployed.\n"
          )
          if run_url:
              note += f"* [Workflow run]({run_url})\n"

          # --- GitHub Release: append to the existing release body, or create it ---
          exists = subprocess.run(
              ["gh", "release", "view", version],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
          ).returncode == 0

          if exists:
              body = subprocess.check_output(
                  ["gh", "release", "view", version, "--json", "body", "-q", ".body"],
                  text=True,
              )
              subprocess.check_call(
                  ["gh", "release", "edit", version, "--notes", body.rstrip() + note]
              )
              print(f"Appended hotfix note to existing release {version}.")
          else:
              subprocess.check_call([
                  "gh", "release", "create", version,
                  "--title", f"Release {version}",
                  "--notes", f"**Docker Image:** `aiyuayaan/aiyu:{version}`{note}",
              ])
              print(f"No existing release; created {version} with hotfix note.")

          # --- CHANGELOG.md: insert a note under this version's heading ---------
          # Best-effort: a failure here must not fail the hotfix. Committed with
          # [skip ci] so the push does not re-trigger any workflow.
          try:
              changelog = Path("CHANGELOG.md")
              text = changelog.read_text(encoding="utf-8")
              bullet = f"> **🔧 Hotfix ({stamp}):** {subject} ({sha})\n"
              heading = re.search(rf"(?m)^##\s*\[?{re.escape(bare)}\]?.*$", text)
              if heading and bullet.strip() not in text:
                  insert_at = heading.end()
                  text = text[:insert_at] + "\n\n" + bullet.rstrip("\n") + text[insert_at:]
                  changelog.write_text(text, encoding="utf-8")
                  subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
                  subprocess.check_call([
                      "git", "config", "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com",
                  ])
                  subprocess.check_call(["git", "add", "CHANGELOG.md"])
                  subprocess.check_call([
                      "git", "commit", "-m",
                      f"docs(changelog): hotfix note for {version} [skip ci]",
                  ])
                  subprocess.check_call(["git", "push"])
                  print(f"Appended hotfix note to CHANGELOG for {bare}.")
              else:
                  print("CHANGELOG heading not found or note already present; skipped.")
          except Exception as exc:  # noqa: BLE001
              print(f"CHANGELOG update skipped (non-fatal): {exc}")
          PY
