name: Build, Release, and Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Create dummy .env file
        run: |
          cat > .env.local << 'EOF'
          MONGODB_URI=mongodb://dummy:dummy@dummy:27017/dummy
          NEXT_PUBLIC_N8N_WEBHOOK_URL=https://dummy-webhook.example.com
          NEXT_PUBLIC_AUTHOR_NAME=Portfolio Author
          ADMIN_USERNAME=dummy
          ADMIN_PASSWORD=dummy
          JWT_SECRET=dummy-jwt-secret-for-ci-build
          GITHUB_TOKEN=dummy-github-token
          EOF
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Build project
        run: npm run build
      
      - name: Build success summary
        if: success()
        run: |
          echo "✅ Build and lint checks passed!"
          echo "The project is ready for merge."
      
      - name: Build failure summary
        if: failure()
        run: |
          echo "❌ Build or lint checks failed!"
          echo "Please review the logs above and fix any issues."
          exit 1

  release:
    name: Create Tag and GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          target-branch: master

  push-to-docker-hub:
    name: Push Docker image to Docker Hub
    needs: [build, release]
    runs-on: ubuntu-latest
    if: needs.release.outputs.release_created == 'true'
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: aiyuayaan/aiyu
          tags: |
            type=raw,value=${{ needs.release.outputs.tag_name }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/aiyuayaan/aiyu
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to Server
    needs: [release, push-to-docker-hub]
    runs-on: ubuntu-latest
    if: needs.release.outputs.release_created == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: RELEASE_TAG
          script: |
            set -e
            
            echo "Starting deployment..."
            echo "Deploying release tag: $RELEASE_TAG"
            
            echo "Navigating to project directory..."
            cd docker/Aiyu/ || { echo "Failed to navigate to docker/Aiyu/"; exit 1; }

            echo "Writing release tag to .env..."
            if grep -q '^APP_IMAGE_TAG=' .env; then
              sed -i "s/^APP_IMAGE_TAG=.*/APP_IMAGE_TAG=$RELEASE_TAG/" .env
            else
              echo "APP_IMAGE_TAG=$RELEASE_TAG" >> .env
            fi
            
            echo "Pulling tagged Docker image..."
            docker compose pull app || { echo "Failed to pull tagged image"; exit 1; }
            
            echo "Restarting containers..."
            docker compose up -d || { echo "Failed to start containers"; exit 1; }
            
            echo "✅ Deployment completed successfully!"
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}

  create-release:
    name: Release Summary
    needs: [release, push-to-docker-hub]
    runs-on: ubuntu-latest
    if: needs.release.outputs.release_created == 'true'
    
    steps:
      - name: Release created
        run: |
          echo "Release created successfully for ${{ needs.release.outputs.tag_name }}"
