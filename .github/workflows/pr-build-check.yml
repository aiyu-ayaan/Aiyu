name: PR Build Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-build:
    name: PR Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether to run full checks
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=draft PR" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.actor }}" == "release-please[bot]" || "${{ github.actor }}" == "github-actions[bot]" || "${{ github.head_ref }}" == release-please--* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=release automation PR" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=full checks required" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate PR title (Conventional Commits)
        if: steps.gate.outputs.skip != 'true'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm install --legacy-peer-deps

      - name: Create CI environment file
        if: steps.gate.outputs.skip != 'true'
        run: |
          cat > .env.local << 'EOF'
          MONGODB_URI=mongodb://dummy:dummy@dummy:27017/dummy
          NEXT_PUBLIC_N8N_WEBHOOK_URL=https://dummy-webhook.example.com
          NEXT_PUBLIC_AUTHOR_NAME=Portfolio Author
          ADMIN_USERNAME=dummy
          ADMIN_PASSWORD=dummy
          JWT_SECRET=dummy-jwt-secret-for-ci-build
          GITHUB_TOKEN=dummy-github-token
          EOF

      - name: Run ESLint
        if: steps.gate.outputs.skip != 'true'
        run: npm run lint

      - name: Build project
        if: steps.gate.outputs.skip != 'true'
        run: npm run build

      - name: Skipped PR checks (intentional)
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "Skipping full checks because this is a ${{ steps.gate.outputs.reason }}."
          echo "This PR status is marked successful so branch protection can pass."

      - name: Full checks passed
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "Build and lint checks passed."
