name: Release (manual dispatch)

# Run by hand from the Actions tab (or `gh workflow run release.yml`). It builds
# and pushes the Docker image for the version in package.json, publishes the
# GitHub Release, and deploys to the server ONLY when the `deploy` input is true.
# With deploy=false the server is left alone, so a release that needs manual
# steps on the host (for example a database cutover) can be built here and
# rolled out by hand.
#
#   gh workflow run release.yml -f deploy=false
#   gh workflow run release.yml -f deploy=true
#
# The automatic flow in release-manual.yml is unchanged.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to the server after the image is pushed'
        type: boolean
        required: true
        default: false
      version:
        description: 'Version to release (X.Y.Z). Empty = package.json version'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

# Shares the group with release-manual.yml so a dispatch never builds or
# deploys on top of an automatic run.
concurrency:
  group: release-refs/heads/master
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version '$VERSION'. Expected X.Y.Z."
            exit 1
          fi
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: v$VERSION (deploy=${{ inputs.deploy }})"

  push-to-docker-hub:
    name: Push Docker image to Docker Hub
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: aiyuayaan/aiyu
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/aiyuayaan/aiyu
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to Server
    needs: [prepare, push-to-docker-hub]
    if: inputs.deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same config sync as release-manual.yml: docker-compose.yml and nginx.conf
      # land in a staging dir, then get backed up, installed and validated.
      - name: Upload deployment config to server
        if: vars.SYNC_DEPLOY_CONFIG != 'false'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: 'docker-compose.yml,nginx.conf'
          target: docker/Aiyu/.deploy-sync/
          overwrite: true

      - name: Install deployment config on server
        if: vars.SYNC_DEPLOY_CONFIG != 'false'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd docker/Aiyu/ || { echo "Failed to navigate to docker/Aiyu/"; exit 1; }

            STAMP="$(date +%Y%m%d-%H%M%S)"
            mkdir -p .deploy-backup

            for FILE in docker-compose.yml nginx.conf; do
              NEW=".deploy-sync/$FILE"
              [ -f "$NEW" ] || { echo "Missing uploaded $FILE"; exit 1; }
              if [ -f "$FILE" ] && cmp -s "$FILE" "$NEW"; then
                echo "$FILE unchanged."
                continue
              fi
              if [ -f "$FILE" ]; then
                cp "$FILE" ".deploy-backup/$FILE.$STAMP"
                echo "Backed up $FILE to .deploy-backup/$FILE.$STAMP"
              fi
              cp "$NEW" "$FILE"
              echo "Updated $FILE from repo."
            done

            restore() {
              for FILE in docker-compose.yml nginx.conf; do
                if [ -f ".deploy-backup/$FILE.$STAMP" ]; then
                  cp ".deploy-backup/$FILE.$STAMP" "$FILE"
                fi
              done
            }

            echo "Validating nginx.conf..."
            if ! sudo docker run --rm \
              -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
              nginx:alpine nginx -t -c /etc/nginx/nginx.conf; then
              echo "nginx.conf failed validation; restoring previous config."
              restore
              exit 1
            fi

            echo "Validating docker-compose.yml..."
            sudo docker compose config -q || {
              echo "docker-compose.yml is invalid; restoring previous config."
              restore
              exit 1
            }

            rm -rf .deploy-sync
            ls -1t .deploy-backup/docker-compose.yml.* 2>/dev/null | tail -n +11 | xargs -r rm -f
            ls -1t .deploy-backup/nginx.conf.* 2>/dev/null | tail -n +11 | xargs -r rm -f
            echo "Deployment config sync complete."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd docker/Aiyu/ || { echo "Failed to navigate to docker/Aiyu/"; exit 1; }

            echo "Pulling latest Docker image..."
            sudo docker compose pull || { echo "Failed to pull latest image"; exit 1; }

            echo "Restarting containers..."
            sudo docker compose up -d || { echo "Failed to start containers"; exit 1; }

            # nginx.conf is a bind mount, so a changed file does not recreate the
            # container. Reload explicitly to pick up config edits.
            sudo docker compose exec -T nginx nginx -s reload || echo "nginx reload skipped."
            echo "Deployment completed successfully!"

  create-release:
    name: Create GitHub Release
    needs: [prepare, push-to-docker-hub, deploy]
    # Runs when the image was pushed and the deploy either succeeded or was
    # skipped by the flag; a failed deploy does not publish a release.
    if: >-
      always() &&
      needs.push-to-docker-hub.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re

          version = os.environ["RELEASE_VERSION"].lstrip("v").strip()
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              text = ""

          notes = ""
          match = re.search(
              rf"(?ms)^##\s*\[?{re.escape(version)}\]?.*?(?=^##\s|\Z)",
              text,
          )
          if match:
              parts = match.group(0).strip().split("\n", 1)
              notes = parts[1].strip() if len(parts) > 1 else ""

          delimiter = "CHANGELOG_NOTES_EOF"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"notes<<{delimiter}\n{notes}\n{delimiter}\n")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          body: |
            **Docker Image:** `aiyuayaan/aiyu:${{ needs.prepare.outputs.version }}`

            ### Deployment Status
            - ✅ Docker image pushed to Docker Hub
            - ${{ inputs.deploy && '✅ Server successfully deployed' || '⏸️ Server deploy skipped (deployed manually)' }}

            ${{ steps.notes.outputs.notes }}

            ---
          draft: false
          prerelease: false
