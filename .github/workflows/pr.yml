name: PR Checks

# Quality gate for pull requests. Each check runs as its own job so they
# execute in parallel and a failure points straight at the stage that broke
# (lint vs unit vs e2e vs build). Pushes that supersede an in-flight run cancel
# it via the concurrency group below, so only the latest commit burns minutes.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup & install
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm run lint

      - name: Typecheck web/ (tsc)
        run: pnpm run web:typecheck

  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup & install
        uses: ./.github/actions/setup

      - name: Run unit tests
        # vitest runs in jsdom and needs no database or running server.
        run: pnpm run test

  rust:
    name: Rust server (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}

      - name: Run tests
        run: cargo test --locked

  e2e:
    name: E2E tests (playwright)
    runs-on: ubuntu-latest

    # Real Postgres so the e2e suite exercises actual data paths (seeded
    # content, admin auth) instead of the app's empty-DB fallbacks.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aiyu
          POSTGRES_PASSWORD: aiyu
          POSTGRES_DB: aiyu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiyu -d aiyu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://aiyu:aiyu@localhost:5432/aiyu?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup & install
        uses: ./.github/actions/setup

      - name: Create CI .env
        # Both the server (`pnpm dev`, started by playwright.config.js) and the
        # Playwright runner read these. ADMIN_* must be set so the valid-login
        # e2e runs instead of skipping; JWT_SECRET is long on purpose (the app
        # rejects weak secrets).
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://aiyu:aiyu@localhost:5432/aiyu?schema=public
          NEXT_PUBLIC_N8N_WEBHOOK_URL=https://dummy-webhook.example.com
          NEXT_PUBLIC_AUTHOR_NAME=Portfolio Author
          NEXT_PUBLIC_BASE_URL=http://localhost:3000
          ADMIN_USERNAME=aiyu
          ADMIN_PASSWORD=ci-admin-password-1234
          JWT_SECRET=ci-jwt-secret-0123456789abcdef0123456789abcdef0123456789abcdef
          GITHUB_TOKEN=dummy-github-token
          EOF

      - name: Apply database schema
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        run: pnpm run db:seed

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        # Only the chromium project is configured. `--with-deps` is cheap when
        # the browser binary itself is restored from cache.
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm run test:ui

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup & install
        uses: ./.github/actions/setup

      - name: Build project
        # The web bundle and the release server.
        run: pnpm run build
