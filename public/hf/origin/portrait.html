    <script>
      (function () {

        var $ = function (s) { return document.querySelector(s); };
        var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
        var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
        var words = function (text, hl) {

            var cls = hl && hl.indexOf(w.replace(/[.,:]/g, "")) > -1 ? ' class="hl"' : "";
            return '<span class="word"><span' + cls + ">" + esc(w) + "</span></span>";
          }).join(" ");
        };

        $("#rain-date").innerHTML = words("3 May.");
        $("#kid-quote").innerHTML = words("They do only what I tell them to.", ["only", "I", "tell"]);
        if (BORN) $("#stamp-v").textContent = "03 · 05 · " + BORN;

        // Deterministic skyline, rain and drops (no Math.random in a composition).
        var sky = "";
        for (var b = 0; b < 14; b++) sky += '<span style="height:' + (22 + ((b * 37 + b * b * 11) % 60)) + '%"></span>';
        $("#skyline").innerHTML = sky;
        var rain = "";
        var STREAKS = 90;
        for (var r = 0; r < STREAKS; r++) {
          var x = (r * 61) % 100;
          var len = 5 + ((r * 13) % 7);
          rain += '<i style="left:' + x + "%;height:" + len + 'vmin"></i>';
        }
        $("#rain").innerHTML = rain;
        var drops = "";
        for (var d = 0; d < 12; d++) {
          drops += '<i style="left:' + (8 + ((d * 29) % 84)) + "%;top:" + (8 + ((d * 47) % 70)) + '%"></i>';
        }
        $("#drops").innerHTML = drops;

        var tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });

        // ── S1 · rain ──
        $$("#rain i").forEach(function (el, i) {
          var dur = 0.42 + ((i * 7) % 5) * 0.06;
          var reps = Math.ceil(5.6 / dur);
          // Start each streak part-way down so frame 0 is already raining.
          var phase = ((i * 0.37) % 1);
          tl.fromTo(el, { y: -15 + phase * 135 + "vmin" }, { y: "120vmin", duration: dur * (1 - phase), ease: "none" }, 0);
          tl.fromTo(el, { y: "-15vmin" }, { y: "120vmin", duration: dur, ease: "none", repeat: reps, immediateRender: false }, dur * (1 - phase));
        });
        $$("#drops i").forEach(function (el, i) {
          var at = 0.4 + ((i * 0.53) % 4);
          tl.fromTo(el, { y: 0, scaleY: 1 }, { y: "3vmin", scaleY: 1.25, duration: 0.5, ease: "power2.in" }, at);
          tl.to(el, { y: "9vmin", scaleY: 1, duration: 0.8, ease: "power1.in" }, at + 0.9);
        });
        [1.5, 3.3].forEach(function (at, n) {
          tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.05, ease: "none" }, at);
          tl.to("#flash", { opacity: 0, duration: 0.5, ease: "power2.out" }, at + 0.08);
          tl.fromTo("#room-flash", { opacity: 0 }, { opacity: 0.1, duration: 0.05, ease: "none" }, at);
          tl.to("#room-flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, at + 0.08);
          if (n === 0) {
            tl.fromTo("#bolt-path", { strokeDasharray: 260, strokeDashoffset: 260, opacity: 1 }, { strokeDashoffset: 0, duration: 0.08, ease: "none" }, at);
            tl.to("#bolt-path", { opacity: 0, duration: 0.35 }, at + 0.14);
          }
        });

        
        tl.fromTo("#rain-date .word > span", { yPercent: 110 }, { yPercent: 0, duration: 1, stagger: 0.08 }, 0.12);
        tl.fromTo("#rain-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.8 }, 0.6);
        tl.fromTo("#window", { y: 0, scale: 1 }, { y: "-1.5vmin", scale: 1.02, duration: 4.8, ease: "none" }, 0);
        tl.fromTo("#ecg-path", { strokeDashoffset: 760 }, { strokeDashoffset: 0, duration: 2.4, ease: "none" }, 1.8);
        tl.fromTo("#ecg-label", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.9);
        tl.fromTo("#ecg-cursor", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "steps(1)", repeat: 5, yoyo: true }, 4.1);
        // Camera pushes into the window, then the room fades up.
        tl.to("#rain-copy", { opacity: 0, y: -30, duration: 0.45, ease: "power2.in" }, 4.85);
        tl.to("#window", { scale: 1.12, opacity: 0, duration: 0.55, ease: "power2.in" }, 4.9);

        // ── S2 · the child ──
        var S = 5.1;
        tl.fromTo("#scene", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9 }, S);
        tl.fromTo("#kid-copy .eyebrow", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.7 }, S + 0.2);
        tl.fromTo("#kid-lead", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.8 }, S + 0.35);
        // CRT power-on: a bright line opens into the screen.
        tl.fromTo("#crt-led", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, S + 0.3);
        tl.fromTo("#crt-on", { opacity: 0, scaleY: 0.02, transformOrigin: "50% 50%" }, { opacity: 1, scaleY: 1, duration: 0.3, ease: "power3.out" }, S + 0.35);
        tl.to("#crt-on", { opacity: 0.35, duration: 0.5, ease: "power2.out" }, S + 0.65);
        tl.fromTo("#screen", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, S + 0.6);
        tl.fromTo("#room-glow", { opacity: 0 }, { opacity: 0.45, duration: 0.8 }, S + 0.5);
        tl.fromTo("#cur", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "steps(1)", repeat: 25, yoyo: true }, S + 0.6);

        // Each command: the arm taps, the command types, the answer lands,
        // the child lights up a little more.
        var rows = $$("#screen .row");
        tl.set(rows[5], { display: "block" }, S + 0.6);
        var type = function (sel, at, n) {
          tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: n * 0.07, ease: "steps(" + n + ")" }, at);
        };
        var tap = function (at, count) {
          for (var k = 0; k < count; k++) {
            tl.fromTo("#kid-arm", { rotation: 0 }, { rotation: 3, svgOrigin: "420 410", duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1 }, at + k * 0.16);
            tl.fromTo("#key-hit", { y: 0 }, { y: 2, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1 }, at + k * 0.16);
          }
        };
        var react = function (at, level) {
          tl.to("#face-glow", { opacity: level, duration: 0.5, ease: "power2.out" }, at);
          tl.to("#room-glow", { opacity: 0.45 + level * 0.6, duration: 0.6, ease: "power2.out" }, at);
          tl.fromTo("#eye", { scale: 1, svgOrigin: "458 298" }, { scale: 1.35, duration: 0.25, ease: "back.out(3)" }, at);
          tl.to("#eye", { scale: 1.12, svgOrigin: "458 298", duration: 0.5, ease: "power2.out" }, at + 0.3);
          tl.to("#glint", { opacity: 1, duration: 0.2 }, at);
          tl.fromTo("#kid-head", { rotation: 0 }, { rotation: -3, svgOrigin: "412 386", duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1 }, at);
        };

        var C1 = S + 1.1, C2 = S + 2.4, C3 = S + 3.8;
        // 1 · hello → hello
        tl.set(rows[0], { display: "block" }, C1);
        tap(C1, 3); type("#cmd-1", C1, 5);
        tl.set(rows[1], { display: "block" }, C1 + 0.6);
        type("#out-1", C1 + 0.6, 5);
        react(C1 + 0.7, 0.25);
        tl.fromTo("#kid-quote .word:nth-child(-n+3) > span", { yPercent: 110 }, { yPercent: 0, duration: 0.9, stagger: 0.08 }, C1 + 0.7);
        // 2 · draw star → a star
        tl.set(rows[2], { display: "block" }, C2);
        tap(C2, 4); type("#cmd-2", C2, 9);
        tl.fromTo("#star-path", { strokeDasharray: 330, strokeDashoffset: 330 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, C2 + 0.7);
        tl.to("#star-path", { fill: "rgba(255, 236, 120, 0.35)", duration: 0.4 }, C2 + 1.2);
        react(C2 + 0.9, 0.5);
        tl.fromTo("#kid-quote .word:nth-child(n+4):nth-child(-n+5) > span", { yPercent: 110 }, { yPercent: 0, duration: 0.9, stagger: 0.08 }, C2 + 0.9);
        // 3 · 2 + 2 → 4
        tl.set(rows[3], { display: "block" }, C3);
        tap(C3, 3); type("#cmd-3", C3, 5);
        tl.set(rows[4], { display: "block" }, C3 + 0.5);
        type("#out-3", C3 + 0.5, 1);
        react(C3 + 0.6, 0.8);
        tl.fromTo("#kid-quote .word:nth-child(n+6) > span", { yPercent: 110 }, { yPercent: 0, duration: 0.9, stagger: 0.08 }, C3 + 0.6);
        tl.fromTo("#smile", { opacity: 0 }, { opacity: 1, duration: 0.4 }, C3 + 0.8);
        tl.fromTo("#kid-note", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7 }, C3 + 1.2);

        window.__timelines["origin"] = tl;
      })();
    </script>
  </body>
</html>
